<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Synchronisation des élèves</title>
<style>
  :root { font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #f8fafc; color: #111827; font-size: 13px; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #q { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; flex: 1; min-width: 140px; }
  button { padding: 6px 12px; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:disabled { background: #9ca3af; border-color: #9ca3af; cursor: default; }
  #refresh { background: #fff; color: #374151; border-color: #d1d5db; }
  #refresh:hover { background: #f3f4f6; }
  #status { font-size: 12px; color: #374151; }
  #info { font-size: 12px; color: #6b7280; margin-top: 6px; }
  #err { font-size: 12px; color: #b91c1c; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 6px 16px; border-bottom: 1px solid #f1f5f9; }
  th { background: #f9fafb; }
  .b { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .b-new { background: #dbeafe; color: #1d4ed8; }
  .b-upd { background: #fef3c7; color: #b45309; }
</style>
</head>
<body>
<header>
  <h1>Élèves — union des promos, sans doublons</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Rechercher un nom…" />
    <button id="refresh" title="Recharger l'aperçu">&#8635;</button>
    <button id="sync" disabled>Synchroniser</button>
    <span id="status"></span>
  </div>
  <div id="info"></div>
  <div id="err"></div>
</header>
<table>
  <thead>
    <tr><th>Nom</th><th>Prénom</th><th>Promos</th><th>Statut</th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<script>
/* ================================================================
   CONFIGURATION — à adapter si besoin
   - ANNEE_DEBUT       : première promo (2015 -> table Promo_2015_2016)
   - TABLE_ELEVES      : identifiant de la table de synthèse
   - PREFIXE_PROMO     : les tables de promo commencent par ceci
   - ORIGINE_GRIST    : adresse de votre instance Grist
                         (ex. https://grist.apps.education.fr)
   - MODE_REF          : true  -> colonne Promos = liste de références
                               vers la table TABLE_PROMOS_REF (recommandé)
                         false -> colonne Promos = texte ("2015-2016, ...")
   - TABLE_PROMOS_REF  : table des promos, une ligne par année
                         (ex. "2015-2016"), colonne "Annees"
   - FORCER_COLONNES   : null (auto) ou {nom:"Nom", prenom:"Prénom", promos:"Promos"}
   Les tables de promo des années futures (Promo_2026_2027, etc.)
   sont détectées automatiquement dès leur création.
   ================================================================ */
var ANNEE_DEBUT = 2015;
var TABLE_ELEVES = "Eleves";
var PREFIXE_PROMO = "Promo_";
var ORIGINE_GRIST = "https://grist.apps.education.fr";
var MODE_REF = true;
var TABLE_PROMOS_REF = "Promos";
var FORCER_COLONNES = null;
/* ================================================================ */

var etat = { lignes: [], ajouts: 0, majs: 0, promosLues: [], colIds: null, pret: false, surs: false,
             refAnnees: new Map(), refIds: new Map(), colAnnees: "Annees", promosManquantes: [] };

function sansAccent(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function norm(s) {
  return sansAccent(s).trim().replace(/\s+/g, " ").toLowerCase();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function listePromos() {
  var anneeMax = new Date().getFullYear();
  var t = [];
  for (var a = ANNEE_DEBUT; a <= anneeMax; a++) {
    t.push({ id: PREFIXE_PROMO + a + "_" + (a + 1), annees: a + "-" + (a + 1) });
  }
  return t;
}

/* Lit une table. Retourne {ok:true, lignes:[...]} ou {ok:false, err:...}. */
async function lireTable(tableId) {
  var derniereErreur = null;
  if (grist.docApi.fetchRecords) {
    try {
      var recs = await grist.docApi.fetchRecords(tableId);
      return { ok: true, lignes: recs.map(function (r) { return { id: r.id, fields: r.fields }; }) };
    } catch (e) { derniereErreur = e; }
  }
  try {
    var rows = await grist.docApi.fetchTable(tableId);
    return { ok: true, lignes: rows.map(function (r) { return { id: r.id, fields: r }; }) };
  } catch (e) { derniereErreur = e; }
  return { ok: false, err: derniereErreur };
}

function detailErr(e) {
  if (!e) return "";
  return " Détail : " + (e.message || String(e));
}

function colParNom(fields, cible) {
  var ks = Object.keys(fields);
  for (var i = 0; i < ks.length; i++) {
    if (norm(ks[i]) === cible) return ks[i];
  }
  return null;
}

/* Valeur brute d'une colonne liste de références -> [id, ...], ou null. */
function versListeIds(brut) {
  if (brut == null) return [];
  if (Array.isArray(brut)) {
    if (brut.length === 2 && brut[0] === "L" && Array.isArray(brut[1])) return brut[1];
    return brut;
  }
  if (typeof brut === "string") {
    try {
      var v = JSON.parse(brut);
      if (Array.isArray(v)) return (v.length === 2 && v[0] === "L") ? v[1] : v;
    } catch (e) { }
  }
  return null;
}

/* Charge la table des promos : {annees->id, id->annees, colAnnees} ou {absent:...}. */
async function chargerRefPromos() {
  var res = await lireTable(TABLE_PROMOS_REF);
  if (!res.ok) return { absent: true, err: res.err };
  var t = res.lignes;
  var colAnnees = null;
  var annees = new Map();
  var ids = new Map();
  for (var i = 0; i < t.length; i++) {
    var f = t[i].fields;
    if (!colAnnees) {
      colAnnees = colParNom(f, "annees") || colParNom(f, "annee") ||
                  colParNom(f, "nom") || "Annees";
    }
    var a = String(f[colAnnees] == null ? "" : f[colAnnees]).trim();
    if (a) {
      if (!annees.has(a)) annees.set(a, t[i].id);
      ids.set(t[i].id, a);
    }
  }
  return { annees: annees, ids: ids, colAnnees: colAnnees };
}

async function analyser() {
  document.getElementById("err").textContent = "";
  var tous = new Map();
  var promosLues = [];
  var errPromo = null;
  var colPromoRef = null;

  /* 1. Lecture de toutes les tables de promo */
  var promos = listePromos();
  for (var i = 0; i < promos.length; i++) {
    var p = promos[i];
    var res = await lireTable(p.id);
    if (!res.ok) { if (!errPromo) errPromo = res.err; continue; }
    promosLues.push(p.annees);
    var rows = res.lignes;
    if (!rows.length) continue;
    var cNom = colParNom(rows[0].fields, "nom");
    var cPre = colParNom(rows[0].fields, "prenom");
    if (!cNom || !cPre) {
      document.getElementById("err").textContent +=
        "Colonnes Nom/Prénom introuvables dans " + p.id + " · ";
      continue;
    }
    colPromoRef = { nom: cNom, prenom: cPre };
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      var nom = String(r.fields[cNom] == null ? "" : r.fields[cNom]).trim();
      var prenom = String(r.fields[cPre] == null ? "" : r.fields[cPre]).trim();
      if (!nom && !prenom) continue;
      var cle = norm(nom) + "|" + norm(prenom);
      if (!tous.has(cle)) tous.set(cle, { nom: nom, prenom: prenom, promos: [] });
      var fiche = tous.get(cle);
      if (fiche.promos.indexOf(p.annees) === -1) fiche.promos.push(p.annees);
    }
  }

  /* Aucune table de promo lue alors que des erreurs sont survenues :
     très probablement un problème d'accès (ou d'identifiants). */
  if (!promosLues.length && errPromo) {
    document.getElementById("err").textContent =
      "Aucune table de promo n'a pu être lue — vérifiez que le widget a bien " +
      "« l'accès complet au document » (menu ⋮ du widget) et que les tables " +
      "s'appellent Promo_2015_2016, etc." + detailErr(errPromo);
    return;
  }

  /* 2. Table des promos (mode liste de références) */
  var refAnnees = new Map();
  var refIds = new Map();
  var colAnnees = "Annees";
  var promosManquantes = [];
  if (MODE_REF) {
    var ref = await chargerRefPromos();
    if (!ref || ref.absent) {
      document.getElementById("err").textContent =
        "Table « " + TABLE_PROMOS_REF + " » inaccessible — vérifiez son identifiant EXACT " +
        "(bouton « Raw Data » en bas du document ; essayé : « " + TABLE_PROMOS_REF + " »)." +
        " S'il diffère, corrigez TABLE_PROMOS_REF en tête du script." + detailErr(ref && ref.err);
      return;
    }
    refAnnees = ref.annees;
    refIds = ref.ids;
    colAnnees = ref.colAnnees;
    for (var m = 0; m < promosLues.length; m++) {
      if (!refAnnees.has(promosLues[m])) promosManquantes.push(promosLues[m]);
    }
  }

  /* 3. Lecture de la table de synthèse */
  var resE = await lireTable(TABLE_ELEVES);
  if (!resE.ok) {
    document.getElementById("err").textContent =
      "Table « " + TABLE_ELEVES + " » inaccessible — vérifiez son identifiant EXACT " +
      "(bouton « Raw Data » en bas du document ; essayé : « " + TABLE_ELEVES + " »)." +
      " S'il diffère, corrigez TABLE_ELEVES en tête du script." + detailErr(resE.err);
    return;
  }
  var tEleves = resE.lignes;

  var cNom = "Nom", cPre = "Prénom", cPro = "Promos";
  var surs = false;
  if (FORCER_COLONNES) {
    cNom = FORCER_COLONNES.nom; cPre = FORCER_COLONNES.prenom; cPro = FORCER_COLONNES.promos;
    surs = true;
  } else if (tEleves.length) {
    var f = tEleves[0].fields;
    cNom = colParNom(f, "nom") || (colPromoRef ? colPromoRef.nom : cNom);
    cPre = colParNom(f, "prenom") || (colPromoRef ? colPromoRef.prenom : cPre);
    cPro = colParNom(f, "promos") || cPro;
    surs = true;
  } else if (colPromoRef) {
    cNom = colPromoRef.nom; cPre = colPromoRef.prenom;
  }

  var existants = new Map();
  for (var k = 0; k < tEleves.length; k++) {
    var e = tEleves[k];
    var eNom = String(e.fields[cNom] == null ? "" : e.fields[cNom]).trim();
    var ePre = String(e.fields[cPre] == null ? "" : e.fields[cPre]).trim();
    var ePro = e.fields[cPro];
    var cleE = norm(eNom) + "|" + norm(ePre);
    if (existants.has(cleE)) continue;
    if (MODE_REF) {
      var liste = versListeIds(ePro);
      var anneesEx = [];
      if (liste) {
        for (var x = 0; x < liste.length; x++) {
          if (refIds.has(liste[x])) anneesEx.push(refIds.get(liste[x]));
        }
        anneesEx.sort();
      }
      existants.set(cleE, { id: e.id, promos: anneesEx.join(", "), vide: anneesEx.length === 0 });
    } else {
      existants.set(cleE, { id: e.id, promos: String(ePro == null ? "" : ePro).trim() });
    }
  }

  /* 4. Comparaison : nouveaux élèves + promos à mettre à jour */
  var lignes = [];
  var ajouts = 0, majs = 0;
  tous.forEach(function (e, cle) {
    e.promos.sort();
    var promosTxt = e.promos.join(", ");
    var ex = existants.get(cle);
    var statut = "ok";
    var id = null;
    if (!ex) { statut = "nouveau"; ajouts++; }
    else if (MODE_REF ? (ex.vide || ex.promos !== promosTxt) : ex.promos !== promosTxt) {
      statut = "maj"; majs++; id = ex.id;
    }
    lignes.push({ nom: e.nom, prenom: e.prenom, promos: promosTxt, statut: statut, id: id });
  });
  lignes.sort(function (a, b) {
    return a.nom.localeCompare(b.nom, "fr") || a.prenom.localeCompare(b.prenom, "fr");
  });

  etat = {
    lignes: lignes, ajouts: ajouts, majs: majs, promosLues: promosLues,
    colIds: { nom: cNom, prenom: cPre, promos: cPro },
    pret: true, surs: surs,
    refAnnees: refAnnees, refIds: refIds, colAnnees: colAnnees,
    promosManquantes: promosManquantes
  };
  afficher();
}

function afficher() {
  var q = norm(document.getElementById("q").value);
  var lignes = etat.lignes.filter(function (l) {
    return !q || norm(l.nom + " " + l.prenom).indexOf(q) !== -1;
  });
  var badges = {
    nouveau: '<span class="b b-new">nouveau</span>',
    maj: '<span class="b b-upd">promos à mettre à jour</span>',
    ok: ""
  };
  document.getElementById("tbody").innerHTML = lignes.map(function (l) {
    return "<tr><td>" + esc(l.nom) + "</td><td>" + esc(l.prenom) +
      "</td><td>" + esc(l.promos) + "</td><td>" + badges[l.statut] + "</td></tr>";
  }).join("");
  document.getElementById("status").textContent =
    etat.ajouts + " à ajouter · " + etat.majs + " à mettre à jour · " +
    etat.lignes.length + " élève(s) au total";
  document.getElementById("info").textContent = etat.promosLues.length
    ? "Widget " + VERSION + " · Promos lues : " + etat.promosLues[0] + " → " + etat.promosLues[etat.promosLues.length - 1] +
      " (" + etat.promosLues.length + " tables)" +
      (etat.promosManquantes.length ? " · " + etat.promosManquantes.length +
        " ligne(s) à créer dans la table " + TABLE_PROMOS_REF : "")
    : "Aucune table de promo trouvée";
  var btn = document.getElementById("sync");
  var n = etat.ajouts + etat.majs;
  btn.disabled = !n && !etat.promosManquantes.length;
  btn.textContent = n ? "Synchroniser (" + n + ")" : "Synchroniser";
}

/* Ids des lignes de la table Promos pour les années d'un élève. */
function idsPromos(promosTxt) {
  var annees = promosTxt.split(", ");
  var ids = [];
  for (var i = 0; i < annees.length; i++) {
    if (etat.refAnnees.has(annees[i])) ids.push(etat.refAnnees.get(annees[i]));
  }
  return ids;
}

function construireActions(colIds) {
  var actions = [];
  etat.lignes.forEach(function (l) {
    if (l.statut === "nouveau") {
      var f = {};
      f[colIds.nom] = l.nom;
      f[colIds.prenom] = l.prenom;
      f[colIds.promos] = MODE_REF ? idsPromos(l.promos) : l.promos;
      actions.push(["AddRecord", TABLE_ELEVES, null, f]);
    } else if (l.statut === "maj") {
      var u = {};
      u[colIds.promos] = MODE_REF ? idsPromos(l.promos) : l.promos;
      actions.push(["UpdateRecord", TABLE_ELEVES, l.id, u]);
    }
  });
  return actions;
}

async function appliquer(tableId, actions) {
  for (var i = 0; i < actions.length; i += 50) {
    await grist.docApi.applyUpdateActions(actions.slice(i, i + 50));
  }
}

async function synchroniser() {
  if (!etat.pret) return;
  var errEl = document.getElementById("err");
  errEl.textContent = "";
  var btn = document.getElementById("sync");
  btn.disabled = true;
  btn.textContent = "Synchronisation…";
  try {
    /* 1. Créer les lignes manquantes dans la table des promos */
    if (MODE_REF && etat.promosManquantes.length) {
      var actionsP = etat.promosManquantes.map(function (a) {
        var fp = {};
        fp[etat.colAnnees] = a;
        return ["AddRecord", TABLE_PROMOS_REF, null, fp];
      });
      await grist.docApi.applyUpdateActions(actionsP);
      var ref = await chargerRefPromos();
      if (ref && !ref.absent) {
        etat.refAnnees = ref.annees;
        etat.refIds = ref.ids;
      }
    }
    /* 2. Ajouter / mettre à jour les élèves */
    try {
      await appliquer(TABLE_ELEVES, construireActions(etat.colIds));
    } catch (e) {
      if (!etat.surs) {
        await appliquer(TABLE_ELEVES, construireActions({ nom: "Nom", prenom: "Prenom", promos: "Promos" }));
      } else {
        throw e;
      }
    }
  } catch (e) {
    errEl.textContent = "Échec de la synchronisation : " + (e.message || e) +
      " — vérifiez la table « " + TABLE_ELEVES +
      " » (colonnes Nom, Prénom, Promos) et, en mode liste de références, " +
      "que la colonne Promos est bien de type « Reference List » vers « " +
      TABLE_PROMOS_REF + " ».";
    await analyser();
    return;
  }
  await analyser();
}

/* État initial + version (permet de vérifier que Grist charge bien
   la dernière version du fichier hébergé, sans cache). */
var VERSION = "v6";
document.getElementById("status").textContent = "Chargement…";
document.getElementById("info").textContent = "Widget " + VERSION;

document.getElementById("q").addEventListener("input", afficher);
document.getElementById("refresh").addEventListener("click", analyser);
document.getElementById("sync").addEventListener("click", synchroniser);

/* Démarrage une fois l'API Grist chargée : accès complet (lecture
   de toutes les tables de promo + écriture dans Eleves et Promos). */
var origineUtilisee = "?";

function demarrer() {
  grist.ready({ requiredAccess: "full" });
  grist.onRecords(analyser);
  analyser();
  setTimeout(function () {
    if (!etat.pret) {
      document.getElementById("err").textContent =
        "Chargement en attente — accordez au widget l'« accès complet au document » " +
        "(bannière au-dessus du widget ou son menu ⋮), puis cliquez sur ↻. " +
        "API Grist chargée depuis : " + origineUtilisee;
    }
  }, 8000);
}

/* Chargement de l'API Grist depuis l'origine du document Grist
   (détectée automatiquement), avec repli sur docs.getgrist.com.
   Indispensable si votre Grist est auto-hébergé ou hébergé
   ailleurs que sur getgrist.com. */
(function () {
  var origine = null;
  try {
    if (window.location.ancestorOrigins && window.location.ancestorOrigins.length) {
      origine = window.location.ancestorOrigins[0];
    }
  } catch (e) { }
  if (!origine && document.referrer) {
    try { origine = new URL(document.referrer).origin; } catch (e) { }
  }
  var essais = [];
  if (ORIGINE_GRIST) essais.push(ORIGINE_GRIST + "/grist-plugin/grist-plugin.js");
  if (origine && origine.indexOf("https://") === 0 && origine !== ORIGINE_GRIST) {
    essais.push(origine + "/grist-plugin/grist-plugin.js");
  }
  essais.push("https://docs.getgrist.com/grist-plugin/grist-plugin.js");
  var i = 0;
  function essayer() {
    if (i >= essais.length) {
      document.getElementById("err").textContent =
        "Impossible de charger l'API Grist. Origine détectée : " + (origine || "inconnue");
      return;
    }
    origineUtilisee = essais[i];
    var s = document.createElement("script");
    s.src = essais[i];
    s.onload = function () {
      if (window.grist) { demarrer(); } else { i++; essayer(); }
    };
    s.onerror = function () { i++; essayer(); };
    document.head.appendChild(s);
  }
  essayer();
})();
</script>
